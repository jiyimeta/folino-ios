name: Folino
options:
  bundleIdPrefix: com.KeyNumber.Folino
  deploymentTarget:
    iOS: 18.0
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 6.3
    MARKETING_VERSION: 1.12.1
    CURRENT_PROJECT_VERSION: "2172"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEVELOPMENT_LANGUAGE: en
    KNOWN_REGIONS: en ja zh-Hans zh-Hant ko Base
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Folino.xcconfig
  Release: Config/Folino.xcconfig
packages:
  Utility:
    path: Packages/Utility
  Domain:
    path: Packages/Domain
  Infrastructure:
    path: Packages/Infrastructure
  ScoreUI:
    path: Packages/ScoreUI
  Library:
    path: Packages/Features/Library
  Reader:
    path: Packages/Features/Reader
  Editor:
    path: Packages/Features/Editor
  ImportExport:
    path: Packages/Features/ImportExport
  Settings:
    path: Packages/Features/Settings
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  swift-sheet-music:
    url: https://github.com/jiyimeta/swift-sheet-music.git
    exactVersion: 1.13.1
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    exactVersion: 0.63.2
  LicenseList:
    url: https://github.com/cybozu/LicenseList
    from: 2.5.0
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.3.0
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  ScreenshotKit:
    url: git@github.com:jiyimeta/swift-screenshot-kit.git
    revision: 1ef0c01776140616cb5dc94bf2d6b0614185b756
targets:
  Folino:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Folino.entitlements
          - Resources/Soundfonts
          - Resources/Clicks
          - Resources/Fonts
          - Resources/folino.icon
          - ShareExtension
      - path: App/Resources/folino.icon
        type: file
        buildPhase: resources
      - path: App/Resources/Soundfonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Clicks
        type: folder
        buildPhase: resources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.KeyNumber.Folino
        PRODUCT_NAME: folino
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Folino.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: folino
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        # The Crashlytics upload-symbols run script needs to read GoogleService-Info.plist, the dSYM, and reach the
        # network; user script sandboxing blocks that and fails the build with "Could not get GOOGLE_APP_ID". Disable
        # it for the app target only (the project default stays YES).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      - name: "Firebase Crashlytics Upload Symbols"
        # Upload dSYMs for Release builds only — Debug builds use DWARF without a dSYM (see configs.Release above), so
        # running the script there only emits "Unable to process …dSYM" warnings and a pointless network call.
        # basedOnDependencyAnalysis is false because the upload step has no outputs and is meant to run every build.
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}"
          - "$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)"
    dependencies:
      - package: Utility
        products: [UtilityCore, UtilityUI, Navigation]
      - package: Domain
      - package: Infrastructure
        products: [Persistence, CloudSync, Soundfonts, Audio, ScoreFiles, CrashReporting, Analytics]
      - package: Library
      - package: Reader
      - package: Editor
      - package: ImportExport
        products: [ImportExport, ImportExportAppGroup]
      - package: Settings
      - package: swift-sheet-music
        product: SheetMusicLayoutApple
      - package: swift-sheet-music
        product: SheetMusicUI
      - package: LicenseList
        product: LicenseList
      - target: FolinoShareExtension
        embed: true
  FolinoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: App/ShareExtension
        excludes:
          - Info.plist
          - FolinoShareExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.KeyNumber.Folino.ShareExtension
        PRODUCT_NAME: FolinoShareExtension
        INFOPLIST_FILE: App/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ShareExtension/FolinoShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - package: ImportExport
        products: [ImportExportAppGroup, ImportExportShareUI]
      - package: Domain
      - package: Utility
        products: [UtilityCore]
  FolinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FolinoTests
    dependencies:
      - target: Folino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.KeyNumber.Folino.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/folino.app/folino
  FolinoScreenshot:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - FolinoApp.swift
          - Info.plist
          - Folino.entitlements
          - Resources/Soundfonts
          - Resources/Clicks
          - Resources/Fonts
          - Resources/folino.icon
          - ShareExtension
      - path: App/Resources/folino.icon
        type: file
        buildPhase: resources
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: FolinoScreenshot
        excludes:
          - Resources
      - path: FolinoScreenshot/Resources/Now_is_the_time.mscz
        type: file
        buildPhase: resources
      - path: FolinoScreenshot/Resources/annotated-device.png
        type: file
        buildPhase: resources
      - path: FolinoScreenshot/Resources/annotated-device-iphone.png
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.KeyNumber.Folino.screenshot
        # No explicit PRODUCT_NAME: defaults to the target name (FolinoScreenshot), so this
        # target builds to FolinoScreenshot.app instead of sharing folino.app with the main
        # Folino target. Sharing the product path made the screenshot app inherit the main
        # app's embedded FolinoShareExtension.appex, whose bundle-ID prefix
        # (com.KeyNumber.Folino) does not match this target's (…Folino.screenshot) — which
        # broke SwiftUI #Preview / UI-test host installs with a "Mismatched bundle IDs" error.
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Folino.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_APPICON_NAME: folino
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -D SCREENSHOT_ENABLED
    dependencies:
      - package: Utility
        products: [UtilityCore, UtilityUI, Navigation]
      - package: Domain
      - package: Infrastructure
        products: [Persistence, CloudSync, Soundfonts, Audio, ScoreFiles, CrashReporting, Analytics]
      - package: Library
      - package: Reader
      - package: Editor
      - package: ImportExport
        products: [ImportExport, ImportExportAppGroup]
      - package: Settings
      - package: swift-sheet-music
        product: SheetMusicLayoutApple
      - package: swift-sheet-music
        product: SheetMusicMSCX
      - package: swift-sheet-music
        product: SheetMusicCore
      - package: swift-sheet-music
        product: SheetMusicLayout
      - package: swift-sheet-music
        product: SheetMusicUI
      - package: LicenseList
        product: LicenseList
      - package: ScreenshotKit
        products: [ScreenshotKit]
  # Hosted inside the screenshot app: swaps each marketing scene into the host window and writes the App Store PNGs
  # straight into fastlane/screenshots/. One process captures every scene, so there is no per-scene app relaunch.
  # Driven by Scripts/capture-screenshots.sh.
  FolinoScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FolinoScreenshotTests
    dependencies:
      - target: FolinoScreenshot
      - package: ScreenshotKit
        products: [ScreenshotKit, ScreenshotKitCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.KeyNumber.Folino.screenshotTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FolinoScreenshot.app/FolinoScreenshot
schemes:
  Folino:
    build:
      targets:
        Folino: all
        FolinoTests: [test]
        # Built by the test action only, and never run from this scheme: FolinoScreenshot compiles the same App
        # sources against the Feature packages, so it is the one place a removed Feature API shows up as a compile
        # error. Nothing else builds it — the app target doesn't depend on it and no package test links it — so
        # removing a Feature API used to leave every suite green while `Scripts/capture-screenshots.sh` failed to
        # compile, which surfaces only when App Store deliverables are needed, i.e. at the release itself. Kept out
        # of run/archive so the daily build loop and `ios-release` are unchanged.
        FolinoScreenshot: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FolinoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FolinoScreenshot:
    build:
      targets:
        FolinoScreenshot: [run, test]
        FolinoScreenshotTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-UITestMode": true
    test:
      config: Debug
      # The host app only enters screenshot mode (animations off, no on-device capture tool) when it sees
      # `-UITestMode`, and the capture test needs that.
      commandLineArguments:
        "-UITestMode": true
      targets:
        - FolinoScreenshotTests
