# Android version history — independent of iOS. Every entry here must correspond to a build actually released on
# Google Play; the wording mirrors that release's Play changelog under Android/fastlane/metadata/android/<locale>/
# changelogs/<versionCode>.txt. Do not seed this file from App/Resources/VersionHistory.yml — the two platforms ship
# different features on different timelines and have their own version numbering.
- version: 1.2.0
  descriptions:
    - en: Added note editing
      ja: 音符の編集機能を追加
      ko: 음표 편집 기능 추가
      zh-Hans: 新增音符编辑功能
      zh-Hant: 新增音符編輯功能
    - en: Added swiping the seek bar to switch its size
      ja: 再生バーの大きさをスワイプで切り替える機能を追加
      ko: 탐색 막대의 크기를 스와이프로 전환하는 기능 추가
      zh-Hans: 新增滑动切换进度条大小的功能
      zh-Hant: 新增滑動切換進度列大小的功能
    - en: Changed the mixer to be organized by instrument
      ja: ミキサーを楽器ごとの表示に変更
      ko: 믹서를 악기별 표시로 변경
      zh-Hans: 混音器改为按乐器显示
      zh-Hant: 混音器改為依樂器顯示
- version: 1.1.0
  descriptions:
    - en: Added PDF file import
      ja: PDF ファイル読み込み機能を追加
      ko: PDF 파일 가져오기 기능 추가
      zh-Hans: 新增 PDF 文件导入功能
      zh-Hant: 新增 PDF 檔案匯入功能
    - en: Added handwritten annotation on scores
      ja: 楽譜書き込み機能を追加
      ko: 악보 필기 기능 추가
      zh-Hans: 新增乐谱手写批注功能
      zh-Hant: 新增樂譜手寫註解功能
    - en: Added playback aids such as count-in and transposition
      ja: カウントインや移調など、再生補助機能を追加
      ko: 카운트인, 조옮김 등 재생 보조 기능 추가
      zh-Hans: 新增前置节拍、移调等播放辅助功能
      zh-Hant: 新增前置拍、移調等播放輔助功能
    - en: Improved picture-in-picture
      ja: ピクチャー イン ピクチャー機能の改善
      ko: PIP 모드 개선
      zh-Hans: 改进画中画功能
      zh-Hant: 改善子母畫面功能
- version: 1.0.0
  descriptions:
    - en: First release
      ja: 初回リリース
      ko: 첫 출시
      zh-Hans: 首次发布
