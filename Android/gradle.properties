org.gradle.jvmargs=-Xmx2g
org.gradle.java.home=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
android.useAndroidX=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35

# Version of the mavenLocal swift-sheet-music Android AARs (sheet-music-android,
# sheet-music-audio-android, sheet-music-compose-android) to consume. Default is
# the shared 0.0.0-SNAPSHOT slot. Override per worktree with
# -PssmVersion=0.0.0-<branch>-SNAPSHOT to consume a parallel ssm worktree's
# branch-suffixed publish without colliding on the shared SNAPSHOT slot.
ssmVersion=0.0.0-SNAPSHOT
