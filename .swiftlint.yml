disabled_rules:
  - cyclomatic_complexity
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - nesting
  - opening_brace
  - todo
  - trailing_whitespace
  - vertical_whitespace

opt_in_rules:
  - array_init
  - async_without_await
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - convenience_type
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - nimble_operator
  - no_extension_access_modifier
  - nslocalizedstring_key
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# analyzer_rules require `swiftlint analyze` (with a compilation database
# or xcodebuild log) and do NOT fire from `swiftlint lint`. They run via
# SwiftLintBuildToolPlugin at Xcode build time, not via the pre-commit hook.
analyzer_rules:
  - unused_declaration
  - unused_import

included:
  - App
  - Packages

excluded:
  - "**/.build"
  - "**/.swiftpm"

line_length:
  warning: 120

closure_body_length:
  warning: 40

function_body_length:
  warning: 60

file_length:
  warning: 400

type_body_length:
  warning: 400

type_name:
  min_length: 1

identifier_name:
  min_length: 1

# "master" is a standard audio term here (master volume / master bus / master gain — see
# swift-sheet-music's `masterGain`), so it's dropped from the flagged set. slave / whitelist /
# blacklist are still enforced.
inclusive_language:
  override_terms:
    - slave
    - whitelist
    - blacklist

large_tuple:
  warning: 4

trailing_comma:
  mandatory_comma: true

custom_rules:
  no_constrained_extension:
    name: "Constrained Extension"
    regex: '(?m)^[ \t]*extension[ \t]+\w+(?:<[^>]*>)?[ \t\r\n]+where\b'
    message: "Move the where-clause onto individual members. Extension-level where is allowed only with protocol conformance."
    severity: warning
