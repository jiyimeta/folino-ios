repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat
        language: system
        types: [swift]
      - id: swiftlint-autocorrect
        name: SwiftLint (--fix)
        entry: swiftlint --fix --quiet
        language: system
        types: [swift]
      - id: swiftlint
        name: SwiftLint (strict)
        entry: swiftlint lint --strict --quiet
        language: system
        types: [swift]
      # Keeps docs/engineering/ios-android-parity.md in step with the PARITY(...) markers in the source. Rewrites the
      # generated block and fails when it had drifted, so re-stage and commit again.
      - id: parity-ledger
        name: platform parity ledger
        entry: Scripts/parity-report.py --check
        language: system
        pass_filenames: false
        files: '\.(swift|kt|kts)$|^docs/engineering/ios-android-parity\.md$'
