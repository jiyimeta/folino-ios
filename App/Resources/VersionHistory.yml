      zh-Hans: 新增调整主音量的设置
      zh-Hant: 新增調整主音量的設定
    - en: Added a setting to show hidden elements
      ja: 非表示要素を表示する設定を追加
      ko: 숨겨진 요소 표시 설정 추가
      zh-Hans: 新增显示隐藏元素的设置
      zh-Hant: 新增顯示隱藏元素的設定
    - en: Minor bug fixes
      ja: 軽微なバグ修正
      ko: 사소한 버그 수정
      zh-Hans: 修复细微问题
      zh-Hant: 修正細微錯誤
- version: 1.5.1
  descriptions:
    - en: Minor bug fixes
      ja: 軽微なバグ修正
      ko: 사소한 버그 수정
      zh-Hans: 修复细微问题
      zh-Hant: 修正細微錯誤
    - en: Added crash report submission
      ja: クラッシュレポート送信機能の追加
      ko: 충돌 보고서 전송 기능 추가
      zh-Hans: 新增崩溃报告提交功能
      zh-Hant: 新增當機報告提交功能
- version: 1.5.0
  descriptions:
    - en: Added a page view mode
      ja: ページめくり表示モードを追加
      ko: 페이지 보기 모드 추가
      zh-Hans: 新增分页查看模式
      zh-Hant: 新增頁面檢視模式
    - en: Added a setting to prevent auto-lock
      ja: 自動ロックを抑止する設定を追加
      ko: 자동 잠금 방지 설정 추가
      zh-Hans: 新增防止自动锁屏的设置
      zh-Hant: 新增防止自動鎖定的設定
    - en: Improved score deletion
      ja: 楽譜の削除機能を改善
      ko: 악보 삭제 개선
      zh-Hans: 改进乐谱删除
      zh-Hant: 改善樂譜刪除
    - en: Improved file sharing from other apps
      ja: 他のアプリからのファイル共有機能を改善
      ko: 다른 앱에서의 파일 공유 개선
      zh-Hans: 改进从其他应用共享文件的体验
      zh-Hant: 改善從其他應用程式分享檔案的功能
    - en: Added support for tremolo and portamento
      ja: トレモロとポルタメントに対応
      ko: 트레몰로와 포르타멘토 지원 추가
      zh-Hans: 新增颤音与滑音支持
      zh-Hant: 新增顫音與滑音支援
- version: 1.4.0
  descriptions:
    - en: Fixed an issue where score files could not be imported on some devices
      ja: 一部の端末で楽譜ファイルを取り込めない不具合を修正
      ko: 일부 기기에서 악보 파일을 가져올 수 없던 문제 수정
      zh-Hans: 修复部分设备上无法导入乐谱文件的问题
      zh-Hant: 修正部分裝置上無法匯入樂譜檔案的問題
    - en: Added audio (.m4a) export
      ja: オーディオ (.m4a) 出力機能を追加
      ko: 오디오(.m4a) 내보내기 추가
      zh-Hans: 新增音频（.m4a）导出功能
      zh-Hant: 新增音訊（.m4a）匯出功能
- version: 1.3.1
  descriptions:
    - en: Minor bug fixes
      ja: 軽微なバグの修正
      ko: 사소한 버그 수정
