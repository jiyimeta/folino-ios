- version: 1.12.1
  descriptions:
    - en: Minor improvements and bug fixes
      ja: 細かな改善と不具合の修正
      ko: 사소한 개선 및 버그 수정
      zh-Hans: 细节改进与问题修复
      zh-Hant: 細節改進與問題修正
- version: 1.12.0
  descriptions:
    - en: Added a setting to number every measure
      ja: 全ての小節に番号を表示する設定を追加
      ko: 모든 마디에 번호를 표시하는 설정 추가
      zh-Hans: 新增每个小节都显示小节号的设置
      zh-Hant: 新增每個小節都顯示小節號的設定
    - en: Added playback support for scores where a part changes instrument
      ja: 楽器持ち替えのある楽譜の再生に対応
      ko: 파트가 도중에 악기를 바꾸는 악보의 재생 지원 추가
      zh-Hans: 新增对声部中途更换乐器的乐谱的播放支持
      zh-Hant: 新增對聲部中途更換樂器的樂譜的播放支援
    - en: Added display support for staves with other than five lines
      ja: 五線以外の譜線数の表示に対応
      ko: 오선 이외의 줄 수를 가진 보표 표시 지원 추가
      zh-Hans: 新增对非五线（线数不同）谱表的显示支持
      zh-Hant: 新增對非五線（線數不同）譜表的顯示支援
    - en: Fixed the feedback mail screen closing right after it opened
      ja: フィードバックのメール画面が開いてすぐ閉じる問題を修正
      ko: 피드백 메일 화면이 열리자마자 닫히는 문제 수정
      zh-Hans: 修复反馈邮件界面打开后立即关闭的问题
      zh-Hant: 修正回饋郵件畫面開啟後立即關閉的問題
    - en: Fixed minor issues in score display, playback and editing
      ja: 楽譜の表示・再生・編集の細かな不具合を修正
      ko: 악보 표시·재생·편집의 사소한 문제 수정
      zh-Hans: 修复乐谱显示、播放和编辑中的细节问题
      zh-Hant: 修正樂譜顯示、播放與編輯的細節問題
- version: 1.11.0
  descriptions:
    - en: Added opening VocalTuner from the share menu to check your pitch
      ja: 共有メニューからVocalTunerを開いて音程を確認する機能を追加
      ko: 공유 메뉴에서 VocalTuner를 열어 음정을 확인하는 기능 추가
      zh-Hans: 新增从共享菜单打开 VocalTuner 检查音准的功能
      zh-Hant: 新增從分享選單開啟 VocalTuner 檢查音準的功能
    - en: Improved the look of dark mode
      ja: ダークモードの見た目を改善
      ko: 다크 모드 디자인 개선
      zh-Hans: 改进深色模式的显示效果
      zh-Hant: 改進深色模式的顯示效果
    - en: Improved the score editing screen
      ja: 楽譜編集画面の改善
      ko: 악보 편집 화면 개선
      zh-Hans: 改进乐谱编辑界面
      zh-Hant: 改進樂譜編輯介面
    - en: Fixed note input ignoring the key signature
      ja: 音符入力で調号が反映されない問題を修正
      ko: 음표 입력 시 조표가 반영되지 않는 문제 수정
      zh-Hans: 修复音符输入时未应用调号的问题
      zh-Hant: 修正音符輸入時未套用調號的問題
- version: 1.10.0
  descriptions:
    - en: Improved PDF handling so a PDF works like any other score
      ja: PDFを他の楽譜と同等に扱えるよう機能強化
      ko: PDF를 다른 악보와 동일하게 다룰 수 있도록 기능 강화
      zh-Hans: 增强 PDF 功能，使其与其他乐谱一样使用
      zh-Hant: 強化 PDF 功能，使其與其他樂譜一樣使用
    - en: Removed the item limit on Recently Opened
      ja: 「最近開いた楽譜」の表示を無制限に
      ko: '''최근에 연 악보'' 표시 개수 제한 해제'
      zh-Hans: 取消“最近打开的乐谱”的显示数量限制
      zh-Hant: 取消「最近開啟的樂譜」的顯示數量限制
    - en: Added swiping the playback controls left or right to shrink or expand them
      ja: 再生コントロールを左右にスワイプして縮小/拡大表示する機能を追加
      ko: 재생 컨트롤을 좌우로 스와이프해 축소/확대하는 기능 추가
      zh-Hans: 新增左右滑动播放控件以缩小/放大的功能
      zh-Hant: 新增左右滑動播放控制項以縮小/放大的功能
- version: 1.9.0
  descriptions:
