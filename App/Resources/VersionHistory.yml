      zh-Hant: 提升樂譜辨識精度
      ko: 악보 인식 정확도 향상
    - en: Overall UI/UX refinements
      ja: 全体的なUI/UXの改善
      zh-Hans: 整体 UI/UX 优化
      zh-Hant: 整體 UI/UX 改善
      ko: 전반적인 UI/UX 개선
