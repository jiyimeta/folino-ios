      zh-Hant: 修正部分檔案匯入時發生的錯誤
      ko: 일부 파일에서 발생하던 가져오기 오류 수정
    - en: Improved score display and playback
      ja: 楽譜の表示・再生を改善
      zh-Hans: 改进乐谱显示与播放
      zh-Hant: 改善樂譜顯示與播放
      ko: 악보 표시와 재생 개선
- version: 1.1.0
  descriptions:
    - en: Added support for importing MIDI files
      ja: MIDIファイルの取り込みに対応
